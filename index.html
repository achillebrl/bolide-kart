<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9ed8f0">
<title>Bolide, le jeu de kart</title>
<meta name="description" content="Un jeu de kart en 3D à jouer sur ton téléphone : 3 tours, 3 adversaires.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="Le circuit"></canvas>
<div id="vitesse" aria-hidden="true"></div>

<div id="hud" hidden>
  <div class="plaque" id="position" aria-live="polite"><span id="rang">4</span><sup id="suffixe">e</sup></div>
  <div class="compteurs">
    <p id="tour">Tour 1/3</p>
    <p id="chrono">0:00,0</p>
  </div>
</div>

<div id="feux" hidden aria-live="assertive">
  <span class="feu"></span><span class="feu"></span><span class="feu"></span>
  <p id="feux-texte"></p>
</div>

<div id="commandes" hidden>
  <button class="pedale" id="gauche" aria-label="Tourner à gauche"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
  <button class="pedale" id="droite" aria-label="Tourner à droite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
</div>

<section id="titre" class="ecran">
  <h1>Bolide</h1>
  <p class="intro">3 tours, 3 adversaires. Le kart accélère tout seul&nbsp;: penche le téléphone comme un volant, ou garde le doigt sur une flèche.</p>
  <button class="bouton secondaire" id="volant">Activer le volant</button>
  <p class="clavier">Sur ordinateur&nbsp;: les flèches du clavier.</p>
  <button class="bouton" id="jouer">Démarrer la course</button>
</section>

<section id="arrivee" class="ecran" hidden>
  <div class="plaque grande"><span id="rang-final">1</span><sup id="suffixe-final">er</sup></div>
  <p id="resume" class="intro"></p>
  <button class="bouton" id="rejouer">Rejouer la course</button>
</section>

<script type="module" src="src/jeu.js"></script>
</body>
</html>
